<svg width="1200" height="260" viewBox="0 0 1200 260" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="55%" stop-color="#1a0000"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF3030"/>
      <stop offset="35%" stop-color="#FF3030"/>
      <stop offset="55%" stop-color="#8B0000"/>
      <stop offset="75%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="transparent"/>
      <line x1="0" y1="0" x2="4" y2="0" stroke="#FF3030" stroke-opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="1200" height="260" fill="url(#bgGrad)"/>
  <rect width="1200" height="260" fill="url(#scan)"/>

  <rect x="0" y="0" width="1200" height="4" fill="#FF3030"/>
  <rect x="0" y="256" width="1200" height="4" fill="#8B0000"/>

  <text x="600" y="150" text-anchor="middle"
        font-family="Consolas, 'Courier New', monospace"
        font-weight="800" font-size="88" letter-spacing="6"
        fill="url(#textGrad)" filter="url(#glow)">
    RAJATAVA GHOSH
  </text>

  <text x="600" y="205" text-anchor="middle"
        font-family="Consolas, 'Courier New', monospace"
        font-weight="500" font-size="26" letter-spacing="10"
        fill="#ffb3b3" opacity="0.85">
    CYBERSECURITY ANALYST &#8226; ETHICAL HACKER
  </text>

  <line x1="150" y1="180" x2="1050" y2="180" stroke="#FF3030" stroke-width="1" opacity="0.4"/>
</svg>
